[project]
name = "ai-developer-framework"
version = "0.1.0"
description = "Telegram-first, channel-agnostic AI Developer Framework foundation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.29,<1.0",
  "redis>=5.0,<6.0",
  "alembic>=1.13,<2.0",
  "email-validator>=2.1,<3.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0", "pytest-asyncio>=0.23,<1.0", "httpx>=0.27,<1.0", "aiosqlite>=0.20,<1.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["framework*"]
